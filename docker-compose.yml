# Stage 1 (local development): only Kafka runs in Docker.
#   - PostgreSQL = your local Windows install (localhost:5432)
#   - The Spring Boot app = run with `mvn spring-boot:run`
# In the Docker stage we will add the `postgres` and `app` services to this file.
#
# Start:  docker compose up -d
# Stop:   docker compose down

services:

  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "29092:29092"          # host port 29092 -> container port 29092 (for apps on your PC)
    environment:
      # --- KRaft mode: Kafka manages itself, no ZooKeeper needed ---
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller        # this one node is both broker and controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # --- Listeners: the "doors" into Kafka ---
      # PLAINTEXT :9092  -> for other containers (used later by the app container)
      # CONTROLLER:9093  -> internal KRaft traffic
      # EXTERNAL  :29092 -> for programs on your PC (our app right now)
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092
      # The address Kafka tells clients to reconnect to, per door
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # --- Single broker, so every replication factor must be 1 ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms256m"          # keep memory use small
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      retries: 10
      start_period: 20s
